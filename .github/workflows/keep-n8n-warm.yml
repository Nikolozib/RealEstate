name: Keep n8n warm

# Render's free tier spins the n8n instance down after ~15 min of no traffic,
# which made the chatbot/lead/verification webhooks look "broken" whenever a
# cold start ran longer than the client's request timeout. Pinging the plain
# root URL every 10 minutes keeps the dyno awake without ever invoking a real
# workflow (no fake leads, no wasted Pinecone lookups) — GitHub's schedule
# trigger isn't minute-precise, so this is a best-effort keep-warm, not a
# guarantee.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping n8n
        run: curl -sf --max-time 90 -o /dev/null "https://realsang-n8n.onrender.com/"
