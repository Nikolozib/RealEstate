name: Keep n8n warm

# Render's free tier spins the n8n instance down after ~15 min of no traffic.
# This ping runs once daily rather than continuously, so it does not keep the
# instance warm around the clock — cold starts (and the ~50-120s wait they
# cause) still happen for real user traffic between pings. It only prevents
# the instance from sitting fully idle for very long stretches. Pings the
# plain root URL, not a real webhook, so it never creates fake leads or
# wasted Pinecone lookups.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping n8n
        run: curl -sf --max-time 90 -o /dev/null "https://realsang-n8n.onrender.com/"
