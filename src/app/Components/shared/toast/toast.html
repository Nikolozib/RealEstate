<div class="toast-stack" role="region" aria-live="polite" aria-label="Notifications">
  @for (toast of toasts(); track toast.id) {
    <div class="toast" [class]="toast.type" role="alert">
      <i [class]="iconFor(toast.type)" aria-hidden="true"></i>
      <span class="toast-message">{{ toast.message }}</span>
      <button type="button" class="toast-close" (click)="dismiss(toast.id)" aria-label="Dismiss notification">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
  }
</div>
